name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: schedule-api-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/schedule-rsreu/schedule-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build fresh Docker image
        id: build
        run: docker build --pull -t "$IMAGE" .
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.3
      - name: Validate API and Helm before publishing
        run: |
          go test ./...
          helm lint charts/schedule-api --set-string image.tag=test
      - name: Scan compiled service and migration binaries
        run: |
          container="$(docker create "$IMAGE")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/bin/main" /tmp/schedule-api
          docker cp "$container:/usr/local/bin/goose" /tmp/goose
          go version -m /tmp/schedule-api
          go version -m /tmp/goose
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/schedule-api
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/goose

      - name: Publish immutable image
        run: docker push "$IMAGE"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Provision Kubernetes secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BANNED_IPS: ${{ secrets.BANNED_IPS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER GHCR_USERNAME GHCR_PULL_TOKEN \
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB POSTGRES_DSN \
            TELEGRAM_BOT_TOKEN BANNED_IPS; do
            [ -n "$(printenv "$name")" ] || {
              echo "::error::$name is empty"
              exit 1
            }
          done

          b64() {
            printf '%s' "$1" | base64 -w0
          }
          registry_auth="$(b64 "$GHCR_USERNAME:$GHCR_PULL_TOKEN")"
          docker_config="$(printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$registry_auth" | base64 -w0)"

          {
            printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: schedule-api\n---\n'
            printf 'apiVersion: v1\nkind: Secret\nmetadata:\n'
            printf '  name: schedule-api-secrets\n  namespace: schedule-api\ntype: Opaque\ndata:\n'
            printf '  POSTGRES_USER: %s\n' "$(b64 "$POSTGRES_USER")"
            printf '  POSTGRES_PASSWORD: %s\n' "$(b64 "$POSTGRES_PASSWORD")"
            printf '  POSTGRES_DB: %s\n' "$(b64 "$POSTGRES_DB")"
            printf '  POSTGRES_DSN: %s\n' "$(b64 "$POSTGRES_DSN")"
            printf '  TELEGRAM_BOT_TOKEN: %s\n' "$(b64 "$TELEGRAM_BOT_TOKEN")"
            printf '  BANNED_IPS: %s\n' "$(b64 "$BANNED_IPS")"
            printf '%s\n' '---'
            printf 'apiVersion: v1\nkind: Secret\nmetadata:\n'
            printf '  name: ghcr-pull\n  namespace: schedule-api\n'
            printf 'type: kubernetes.io/dockerconfigjson\ndata:\n'
            printf '  .dockerconfigjson: %s\n' "$docker_config"
          } | ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "k3s kubectl apply -f -"

      - name: Deploy atomically
        if: vars.K3S_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p dist
          helm package charts/schedule-api --destination dist
          archive="$(find dist -name 'schedule-api-*.tgz' -print -quit)"
          remote_archive="/tmp/schedule-api-${GITHUB_SHA}.tgz"
          scp -i ~/.ssh/id_ed25519 "$archive" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             helm upgrade --install schedule-api '$remote_archive' \
               --kubeconfig /etc/rancher/k3s/k3s.yaml \
               --namespace schedule-api \
               --set-string image.tag='${GITHUB_SHA}' \
               --atomic --wait --wait-for-jobs --timeout 10m
             rm -f '$remote_archive'"
