---
name: CI

on: [ push, pull_request ]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.3

      - name: Cache lint dependencies
        id: cache-lint-dependencies
        uses: actions/cache@v6.1.0
        with:
          path: bin
          key: ${{ runner.os }}-lint-dependencies-${{ hashFiles('Makefile') }}-${{ hashFiles('.golangci.yml') }}-${{ hashFiles('go.mod') }}

      - name: Install lint dependencies
        if: steps.cache-lint-dependencies.outputs.cache-hit != 'true'
        run: make install

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Run coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Validate Helm chart
        run: |
          helm lint charts/schedule-api --set-string image.tag=test
          helm template schedule-api charts/schedule-api \
            --namespace schedule-api \
            --set-string image.tag=test >/dev/null

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  check-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: schedule-api-check:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build fresh Docker image
        id: build
        run: docker build --pull -t "$IMAGE" .
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'

      - name: Scan compiled service and migration binaries
        run: |
          container="$(docker create "$IMAGE")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/bin/main" /tmp/schedule-api
          docker cp "$container:/usr/local/bin/goose" /tmp/goose
          go version -m /tmp/schedule-api
          go version -m /tmp/goose
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/schedule-api
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/goose

