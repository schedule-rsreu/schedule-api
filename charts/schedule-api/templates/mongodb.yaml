apiVersion: v1
kind: Service
metadata:
  name: schedule-api-mongodb
  labels:
    app.kubernetes.io/name: schedule-api-mongodb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: schedule-api-mongodb
  ports:
    - name: mongodb
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: schedule-api-mongodb
  labels:
    app.kubernetes.io/name: schedule-api-mongodb
spec:
  serviceName: schedule-api-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schedule-api-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schedule-api-mongodb
        logs.vingp.dev/enabled: "true"
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image | quote }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: schedule-api-secrets
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: schedule-api-secrets
                  key: MONGO_PASSWORD
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
