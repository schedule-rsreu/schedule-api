apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-api
  labels:
    app.kubernetes.io/name: schedule-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: schedule-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schedule-api
        logs.vingp.dev/enabled: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: schedule-api
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: schedule-api-secrets
          env:
            - name: ENVIRONMENT
              value: prod
            - name: OTL_ENDPOINT
              value: monitoring-tempo.monitoring.svc.cluster.local:4317
            - name: DWH_URL
              value: {{ .Values.api.dwhUrl | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: schedule-api
  labels:
    app.kubernetes.io/name: schedule-api
    metrics.vingp.dev/enabled: "true"
spec:
  selector:
    app.kubernetes.io/name: schedule-api
  ports:
    - name: metrics
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schedule-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: schedule-api
                port:
                  name: metrics
    {{- end }}
{{- end }}
