image:
  repository: ghcr.io/schedule-rsreu/schedule-api
  tag: ""
  pullPolicy: IfNotPresent

api:
  replicas: 2
  dwhUrl: http://schedule-dwh.schedule-api.svc.cluster.local
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: true
  hosts:
    - api.schedule.vingp.dev
    - api.rsreu-schedule.ru

migration:
  bootstrap: false

postgres:
  image: postgres:18.4
  storage: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 768Mi
